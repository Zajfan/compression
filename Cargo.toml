[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Zajfan/compression"

[workspace.dependencies]
cmpr-codecs = { path = "crates/codecs" }
cmpr-testkit = { path = "crates/testkit" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
flate2 = "1"
liblzma = "0.4"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
